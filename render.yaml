# Free-tier Blueprint — Neon Postgres (external) + Render web services
# Set DATABASE_URL to your Neon pooled connection string in the dashboard.
# After first deploy, set FRONTEND_URL / CORS_ORIGINS / APP_URL / BACKEND_URL / NEXT_PUBLIC_SITE_URL
# to the real https://*.onrender.com hosts, then Manual Deploy again.
# Seed once (API Shell): cd backend && npx tsx prisma/seed.ts

services:
  - type: web
    name: jewellery-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build -w @jewellery/shared && npm run db:generate && npm run build -w @jewellery/backend
    startCommand: cd backend && npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_NAME
        value: Store Admin
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: jewellery-store

  - type: web
    name: jewellery-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build -w @jewellery/shared && NODE_ENV=production npm run build -w @jewellery/frontend
    startCommand: npm run start -w @jewellery/frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Optional: direct browser→API URL (same as BACKEND_URL). Helps when
      # same-origin rewrite 502s during Render free cold starts.
      - key: NEXT_PUBLIC_API_URL
        sync: false
